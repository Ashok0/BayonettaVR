[VR]
; .33 companion owns OpenVR; full native 6DOF starts automatically. F8 recenters.
; Set ExternalCompositor=0 to restore the previous path.
ExternalCompositor=1
; Set to 0 to make the proxy a no-op apart from forwarding Direct3D 9.
Enabled=1

; Draw the Steam scene renderer twice per simulation frame, once per eye.
; Set to 0 to fall back to the earlier alternating-frame stereo path.
NativeStereo=1

; Optional SteamVR half-rate request. Leave off for the tested baseline.
ForceHalfRate=0

; Remove desktop-vsync blocking. The game still runs at about 60 fps;
; the compositor handles rotation at the headset's display rate.
UncapPresent=1

; Track head translation in the native scene. F8 recentres the pose.
PositionalTracking=1

; Preserve the smooth baseline's compositor rotation, with fully tracked eye
; positions (including each eye's motion around the head during rotation).
; Translation updates at the game rate. Automatic turning is controlled below.
; Set to 0 only to retry the older native-rotation path that showed judder.
CompositorRotation=1

; Start with the user-confirmed smooth fixed-direction positional tracking.
; The .25 automatic direction handoffs caused jumps in headset testing.
; F6 enables the comparison selected below; F5 toggles a reference grid.
AutomaticTurning=0

; 1: F6 uses native full 6DOF from WaitGetPoses with ordinary submission.
; No stepped render direction and no custom render-pose override in this test.
; 0: F6 re-enables the .25/.26 stepped synthetic-pose test (known to jump).
; Earlier native tracking juddered; the independent grid now helps isolate it.
DirectPoseTurning=1

; Keep the baseline's documented ordering: submit, desktop Present, then
; PostPresentHandoff. F4 can still toggle the rejected early-order diagnostic.
NativeEarlySubmit=0

; Full native F6 tracking: attach the exact pose captured with each eye using
; Submit_TextureWithPose. This is the .29 comparison against .27/.28's
; Submit_Default path; the smooth startup mode already uses explicit poses.
NativeExplicitPose=1

; Legacy DirectPoseTurning=0 ONLY: advance render orientation after this angle.
; The recenter/world origin never changes; SteamVR still handles rotation
; between game frames. Works across yaw wraparound and with pitch and roll.
; 0 restores the fixed-direction .24 behavior; valid nonzero range is 2..45.
; F6 toggles automatic turning live, keeping positional tracking active.
; Handoffs are known to jump. Retained for the F5 reference-grid comparison.
CompositorTurnDegrees=12.0

; 0 starts with positional tracking; 1 starts with the fixed smooth baseline.
; F7 toggles ONLY these two modes. F6 compares automatic vs fixed direction.
CompositorPoseDiagnostic=0

; Metres of tracked head movement expressed in Bayonetta world units. The
; conservative default avoids the extreme stereo separation of the old 100.0
; bring-up value. Tune this only after the stereo pair can be fused.
WorldUnitsPerMetre=1.0

; Multiplier for physical eye separation, independent of head translation.
; F9 cycles 1.0, 0.5, 0.25, 0.0 (mono diagnostic), and 2.0 at runtime.
StereoScale=1.0

; Used to remove the game's projection before applying each HMD eye frustum.
GameVerticalFovDegrees=60.0
NearClip=0.1
FarClip=100000.0

; 0=native headset lens center, 1=reversed horizontal lens center,
; 2=centered diagnostic. F11 cycles these modes at runtime.
ProjectionMode=0

; Legacy orthographic override; used only when WorldLockedHUD=0.
ApplyToUI=0
; F10 toggles this at runtime.
SwapEyes=0
; Keep the normal desktop image. Set to 1 only when inspecting both eyes.
MirrorSideBySide=0

; -1 uses automatic vertex-shader analysis. If the log identifies a better
; view-projection constant register, enter it here for every shader.
MatrixRegisterOverride=-1

; .34: Fixed HUD panel. F8 reanchors it in front of you. Restart after edits.
; Increase width or reduce distance for larger UI; positive offset moves up.
WorldLockedHUD=1
HUDDistanceMetres=2.0
HUDWidthMetres=3.2
HUDVerticalOffsetMetres=0.0

; .40: Headset image enhancement. F2 toggles while the game is focused.
; Restart after editing. ImageEnhancement=0 restores the original image.
ImageEnhancement=0
ImageSharpness=0.45
ImageContrast=1.12
ImageSaturation=1.06

; .41: Touch controllers as Xbox 360 player one; retains .39 visuals.
; Both stick clicks held for 1 second recenter camera and HUD.
; Grip + same-hand stick click: left Start, right Back.
; Both grips + right stick: D-pad. Oculus reserves the right System button.
VRControllers=1

; .42: Disable four verified cutscene DOF shaders. Set to 0 and restart to restore.
DisableDepthOfField=1
; Shift+F1 toggles motion-blur bypass for comparison.
DisableMotionBlur=1
; .46: F1 toggles ambient-shadow bypass; Shift+F1 toggles motion blur.
DisableAmbientOcclusion=1
